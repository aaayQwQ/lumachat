# LumaChat custom OpenAI-compatible provider configuration
# Copy to config/config.ini next to the compiled executable, or add a provider in the web UI.
# Replace every placeholder. Never commit real API keys.
# Base URL is the API root; the app appends /models and /chat/completions.
# Leave api_key empty only if your custom endpoint does not require authentication.

[provider_custom]
name=My Custom API
base_url=https://api.example.com/v1
api_key=replace-with-your-api-key
models=your-model-id
thinking_switch=false
search_extra_body=false
